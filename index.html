<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR Simple</title>

  <!-- Librería del lector QR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
      text-align: center;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
      font-size: 16px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <h2>Lector QR Simple</h2>

  <div id="reader"></div>

  <h3>Resultado:</h3>
  <div id="resultado">Aún no se leyó ningún QR...</div>

  <script>
    // Crear lector
    const reader = new Html5Qrcode("reader");

    // Iniciar cámara trasera
    Html5Qrcode.getCameras().then(cameras => {
      if (cameras && cameras.length) {
        let camId = cameras[0].id;  // Si hay varias cámaras, toma la primera

        reader.start(
          camId,
          {
            fps: 10,
            qrbox: 250
          },
          qrText => {
            document.getElementById("resultado").innerText = qrText;
          },
          errorMessage => {
            // Ignorar errores de escaneo
          }
        );
      }
    }).catch(err => {
      document.getElementById("resultado").innerText = "Error al acceder a la cámara: " + err;
    });
  </script>

</body>
</html>
