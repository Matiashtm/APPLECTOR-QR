<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR Simple</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
      text-align: center;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      font-size: 16px;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }
  </style>
</head>
<body>

  <h2>Lector QR Simple (Cámara Trasera)</h2>

  <div id="reader"></div>

  <h3>Resultado:</h3>
  <div id="resultado">Aún no se leyó ningún QR...</div>

  <script>
    const reader = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(cameras => {
      if (cameras.length === 0) {
        document.getElementById("resultado").innerText = "No se encontraron cámaras.";
        return;
      }

      // Intentar encontrar cámara trasera por su nombre
      let backCamera = cameras.find(
        cam => /back|rear|environment|trasera/i.test(cam.label)
      );

      let camId = backCamera ? backCamera.id : cameras[0].id;

      reader.start(
        camId,
        { fps: 10, qrbox: 250 },
        qrText => {
          document.getElementById("resultado").innerText = qrText;
        },
        err => {}
      );
    })
    .catch(err => {
      document.getElementById("resultado").innerText = "Error cámara: " + err;
    });
  </script>

</body>
</html>
