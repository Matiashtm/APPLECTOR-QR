<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Escanear Factura AFIP/ARCA</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: #fff;
}
#reader {
  width: 95%;
  margin: auto;
}
.dato {
  background: #222;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  text-align: left;
}
</style>

</head>
<body>

<h2>ESCANEAR FACTURA QR</h2>
<div id="reader"></div>

<h3>DATOS OBTENIDOS</h3>
<div id="datos" class="dato">Esperando escaneo...</div>

<script>
// --- Iniciar lector con cámara TRASERA ---
function startScanner() {
    const html5QrCode = new Html5Qrcode("reader");

    const config = {
        fps: 10,
        qrbox: 250,
        facingMode: { exact: "environment" } // 👈 CAMARA TRASERA
    };

    html5QrCode.start(
        { facingMode: { exact: "environment" } },
        config,
        onScanSuccess
    ).catch(err => {
        document.getElementById("datos").innerHTML = "ERROR: " + err;
    });
}

startScanner();

// --- Cuando escanea un QR ---
function onScanSuccess(decodedText) {
    console.log("QR:", decodedText);

    // Los QR de factura vienen con un link tipo:
    // https://www.afip.gob.ar/fe/qr/?p=eyJ...
    let url = new URL(decodedText);
    let param = url.searchParams.get("p");

    // Decodifico el JSON interno
    let json = JSON.parse(atob(param));

    /*
      Ejemplo JSON AFIP / ARCA:
      {
        "ver":1,
        "fecha":"2024-11-22",
        "cuit":20123456789,
        "ptoVta":5,
        "tipoCmp":1,
        "nroCmp":123,
        "importe":4500.25,
        "moneda":"PES",
        "ctz":1,
        "tipoDocRec":96,
        "nroDocRec":12345678,
        "tipoCodAut":"E",
        "codAut":70417347368324
      }
    */

    let html =
        "<b>CUIT:</b> " + json.cuit + "<br>" +
        "<b>Fecha:</b> " + json.fecha + "<br>" +
        "<b>Importe:</b> $" + json.importe + "<br>" +
        "<b>Punto de Venta:</b> " + json.ptoVta + "<br>" +
        "<b>Tipo Comprobante:</b> " + json.tipoCmp + "<br>" +
        "<b>Número Comprobante:</b> " + json.nroCmp + "<br>" +
        "<b>Moneda:</b> " + json.moneda + "<br>" +
        "<b>CAE:</b> " + json.codAut + "<br>";

    document.getElementById("datos").innerHTML = html;
}
</script>

</body>
</html>
