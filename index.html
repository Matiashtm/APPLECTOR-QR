<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Escanear Factura</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Contenedor principal */
#container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Título */
header {
    padding: 12px;
    background: #111;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* Scanner */
#reader {
    width: 100%;
    height: 55vh;
    margin: 0 auto;
}

/* Datos */
#datos {
    flex: 1;
    background: #111;
    padding: 12px;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.5;
    border-top: 1px solid #333;
}
</style>
</head>
<body>

<div id="container">

<header>ESCANEAR FACTURA QR</header>

<div id="reader"></div>

<div id="datos">Esperando escaneo...</div>

</div>

<script>
function startScanner() {
    const html5QrCode = new Html5Qrcode("reader");

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 }
    };

    html5QrCode.start(
        { facingMode: "environment" },  // Cámara trasera fija
        config,
        onScanSuccess
    ).catch(err => {
        document.getElementById("datos").innerHTML = "ERROR: " + err;
    });
}

startScanner();

// PROCESAR QR
function onScanSuccess(decodedText) {
    try {
        const url = new URL(decodedText);
        const param = url.searchParams.get("p");
        const json = JSON.parse(atob(param));

        document.getElementById("datos").innerHTML = `
            <b>CUIT:</b> ${json.cuit}<br>
            <b>Fecha:</b> ${json.fecha}<br>
            <b>Importe:</b> $${json.importe}<br>
            <b>Punto de Venta:</b> ${json.ptoVta}<br>
            <b>Tipo Comprobante:</b> ${json.tipoCmp}<br>
            <b>Número Comprobante:</b> ${json.nroCmp}<br>
            <b>Moneda:</b> ${json.moneda}<br>
            <b>CAE:</b> ${json.codAut}<br>
        `;
    } catch (e) {
        document.getElementById("datos").innerHTML = "QR no válido.";
    }
}
</script>

</body>
</html>
